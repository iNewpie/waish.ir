<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>waish@computer</title>
<link rel="icon" type="image/png" href="assets/waish.png?v=20260916b">
<link rel="apple-touch-icon" href="assets/waish.png?v=20260916b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20260916f">
<link rel="stylesheet" href="css/desktop.css?v=20260917b">
<style>
  /* terminal wallpaper opacity — fixed at 12% */
  :root { --bg-opacity: .12; }
  body { background: var(--bg); }
</style>
</head>
<body class="desktop-page">

<div class="desktop">
  <canvas id="particles"></canvas>
  <div class="glow"></div>

  <div class="icons"></div>
  <div class="windows"></div>

  <div class="taskbar">
    <button class="start" type="button">waish<small>.ir</small></button>
    <div class="pinned"></div>
    <div class="tasks"></div>
    <div class="clock"></div>
  </div>
  <div class="start-menu" hidden>
    <div class="sm-head">apps</div>
    <div class="sm-apps"></div>
    <hr>
    <div class="sm-head">site</div>
    <a href="index.html"><span class="sm-ico" style="background:#1a1e27;color:var(--accent)">⌂</span>Home</a>
    <a href="projects.html"><span class="sm-ico" style="background:#1a1e27">🧱</span>Projects page</a>
    <a href="about-me.html"><span class="sm-ico" style="background:#1a1e27">🧑‍💻</span>About me page</a>
    <a href="contact.html"><span class="sm-ico" style="background:#1a1e27">📬</span>Contact</a>
  </div>
</div>

<!-- the terminal window's contents; cloned into a window by desktop.js -->
<template id="terminalTemplate">
  <div class="term-bg"></div>
  <div class="term-body"></div>
  <div class="input-row">
    <span class="prompt-sym">➜</span><span class="prompt-path">~</span>
    <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="type /help, or ask anything (English / فارسی)" dir="auto" />
  </div>
  <p class="term-caption">// This terminal is handmade and its been developing overtime in here, feel free to use it and know more about <b>waish</b>.</p>
</template>

<script src="js/i18n.js?v=20260917a"></script>
<script>document.querySelector('.taskbar').insertBefore(I18N.button(), document.querySelector('.clock'));</script>
<script src="js/fx.js?v=20260917a"></script>
<script src="js/projects-data.js?v=20260916c"></script>
<script src="js/llm-db.js?v=20260917a"></script>
<script src="js/llm.js?v=20260917a"></script>
<script src="js/terminal.js?v=20260916b"></script>
<script>

  // called by desktop.js when the terminal window is created
  window.bootTerminal = function (win) {
    const body = win.querySelector('.term-body'), input = win.querySelector('#cmdInput');
    const term = initTerminal({ body, input, mode: 'full' });
    (async () => {
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const T = I18N.t;
      const boot = [
        [`<span class="out-dim">${T('booting waish@computer…')}</span>`, 0],
        [`<span class="out-green">✔</span> ${T('knowledge base loaded')} <span class="out-dim">(${WAISH_DB.entries.length} ${T('topics · en / fa')})</span>`, 260],
        [`<span class="out-green">✔</span> ${T('assistant online')}`, 200],
        ['', 120],
        [`${T('Welcome. Commands start with')} <span class="out-red">/</span> ${T('— try')} <span class="out-blue">/help</span>${T('. Anything else is a question for me.')}`, 0],
        [`<span class="out-dim">${T('Tip:')} <span class="out-blue">/open projects</span> ${T('opens an app window ·')} <span class="out-blue">/apps</span> ${T('lists them.')}</span>`, 120],
        ['', 0],
      ];
      for (const [html, delay, cls] of boot) { await sleep(delay); term.print(html, cls); }
    })();
    // keep focus in the input when clicking the terminal body
    win.querySelector('.win-body').addEventListener('click', () => { if (!window.getSelection().toString()) input.focus(); });
  };
</script>
<script src="js/desktop.js?v=20260917b"></script>
<script>
  DESKTOP.open('terminal');
  // deep link: computer.html#projects opens that app too
  if (location.hash) DESKTOP.open(location.hash.slice(1));
</script>
</body>
</html>
