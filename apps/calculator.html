<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="icon" type="image/png" href="../assets/waish.png?v=20260916b">
<link rel="apple-touch-icon" href="../assets/waish.png?v=20260916b">
<link rel="stylesheet" href="../css/site.css?v=20260916b">
<link rel="stylesheet" href="../css/apps.css?v=20260916b">
<style>
  .app-main { flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 0; }
  .calc { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .display { padding: 22px 20px 14px; text-align: right; font-family: var(--mono); background: var(--card); border-bottom: 1px solid var(--line); min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; direction: ltr; }
  .display .expr { font-size: 14px; color: var(--muted); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .display .res { font-size: 38px; font-weight: 600; color: var(--ink); letter-spacing: -1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .display .res.err { color: var(--accent-soft); font-size: 20px; }
  .keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 6px; padding: 10px; }
  .keys button { font-family: var(--mono); font-size: 18px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--ink); cursor: pointer; transition: background .12s, border-color .12s, transform .08s; min-height: 40px; }
  .keys button:hover { background: rgba(255,255,255,.07); }
  .keys button:active { transform: scale(.96); }
  .keys button.op { color: var(--accent-soft); font-weight: 600; }
  .keys button.fn { color: var(--muted); font-size: 15px; }
  .keys button.eq { background: var(--accent); border-color: var(--accent); color: #fff; }
  .keys button.eq:hover { background: var(--accent-soft); }
  .hist { flex: none; max-height: 96px; overflow-y: auto; border-top: 1px solid var(--line); padding: 6px 10px; font-family: var(--mono); font-size: 12px; direction: ltr; }
  .hist:empty { display: none; }
  .hist button { display: flex; justify-content: space-between; width: 100%; background: transparent; border: 0; color: var(--muted); font-family: inherit; font-size: inherit; padding: 4px 6px; border-radius: 6px; cursor: pointer; text-align: left; gap: 10px; }
  .hist button:hover { background: rgba(255,255,255,.05); color: var(--ink); }
  .hist button b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body class="app">
<div class="app-bar"><b>🧮 <span data-t="Calculator">Calculator</span></b><span class="sp"></span><span class="pill" id="hintPill" data-t="keyboard works too">keyboard works too</span></div>
<div class="app-main">
  <div class="calc">
    <div class="display"><div class="expr" id="expr">&nbsp;</div><div class="res" id="res">0</div></div>
    <div class="keys" id="keys">
      <button class="fn" data-k="C">C</button><button class="fn" data-k="(">(</button><button class="fn" data-k=")">)</button><button class="fn" data-k="⌫">⌫</button>
      <button class="fn" data-k="√">√</button><button class="fn" data-k="x²">x²</button><button class="fn" data-k="%">%</button><button class="op" data-k="÷">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button class="fn" data-k="±">±</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
    </div>
    <div class="hist" id="hist"></div>
  </div>
</div>
<script>
const FA = { 'Calculator': 'ماشین‌حساب', 'keyboard works too': 'با کیبورد هم کار می‌کنه', 'Error': 'خطا', 'Division by zero': 'تقسیم بر صفر' };
let lang = 'en'; try { lang = localStorage.getItem('waish-lang') === 'fa' ? 'fa' : 'en'; } catch (e) {}
const t = s => lang === 'fa' && FA[s] ? FA[s] : s;
if (lang === 'fa') { document.body.classList.add('fa'); document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); }
const faDigits = s => lang === 'fa' ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s);

const exprEl = document.getElementById('expr'), resEl = document.getElementById('res'), histEl = document.getElementById('hist');
let expr = '', justEvaluated = false;

/* ---------- tokenizer + shunting-yard evaluator (no eval) ---------- */
function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ') { i++; continue; }
    if (/[\d.]/.test(ch)) { let j = i; while (j < s.length && /[\d.]/.test(s[j])) j++; const n = s.slice(i, j); if ((n.match(/\./g) || []).length > 1) throw 0; out.push({ n: parseFloat(n) }); i = j; continue; }
    if ('+-*/^%()√'.includes(ch)) { out.push({ o: ch }); i++; continue; }
    throw 0;
  }
  return out;
}
function evaluate(s) {
  const toks = tokenize(s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'));
  // unary minus / √ → mark as functions
  const out = [], ops = [];
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2, '%': 2, '^': 3, 'neg': 4, '√': 4 };
  const rightAssoc = { '^': 1, 'neg': 1, '√': 1 };
  let prev = null;
  const apply = () => {
    const op = ops.pop();
    if (op === 'neg') { const a = out.pop(); if (a === undefined) throw 0; out.push(-a); return; }
    if (op === '√') { const a = out.pop(); if (a === undefined || a < 0) throw 0; out.push(Math.sqrt(a)); return; }
    const b = out.pop(), a = out.pop(); if (a === undefined || b === undefined) throw 0;
    if (op === '+') out.push(a + b); else if (op === '-') out.push(a - b); else if (op === '*') out.push(a * b);
    else if (op === '/') { if (b === 0) throw 'div0'; out.push(a / b); } else if (op === '%') out.push(a % b); else if (op === '^') out.push(Math.pow(a, b));
  };
  for (const tk of toks) {
    if ('n' in tk) { out.push(tk.n); prev = 'n'; continue; }
    let o = tk.o;
    if (o === '(') { ops.push(o); prev = '('; continue; }
    if (o === ')') { while (ops.length && ops[ops.length - 1] !== '(') apply(); if (!ops.length) throw 0; ops.pop(); prev = ')'; continue; }
    if (o === '-' && (prev === null || prev === 'op' || prev === '(')) o = 'neg';
    if (o === '√') { ops.push(o); prev = 'op'; continue; }
    while (ops.length && ops[ops.length - 1] !== '(' && (prec[ops[ops.length - 1]] > prec[o] || (prec[ops[ops.length - 1]] === prec[o] && !rightAssoc[o]))) apply();
    ops.push(o); prev = 'op';
  }
  while (ops.length) { if (ops[ops.length - 1] === '(') throw 0; apply(); }
  if (out.length !== 1 || !isFinite(out[0])) throw 0;
  return out[0];
}
const fmt = n => { if (!isFinite(n)) return '∞'; const s = Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0) ? n.toExponential(8).replace(/\.?0+e/, 'e') : String(+n.toPrecision(12)); return faDigits(s); };

function render(preview = true) {
  exprEl.textContent = faDigits(expr) || ' ';
  if (!expr) { resEl.textContent = faDigits('0'); resEl.classList.remove('err'); return; }
  if (preview) { try { resEl.textContent = fmt(evaluate(expr)); resEl.classList.remove('err'); } catch (e) { /* incomplete expression: keep the last result shown */ } }
}
function press(k) {
  const lastCh = expr.slice(-1);
  if (k === 'C') { expr = ''; justEvaluated = false; resEl.textContent = faDigits('0'); resEl.classList.remove('err'); render(false); return; }
  if (k === '⌫') { expr = expr.slice(0, -1); justEvaluated = false; render(); return; }
  if (k === '=') {
    if (!expr) return;
    try { const v = evaluate(expr); const shown = fmt(v); addHist(expr, shown); resEl.textContent = shown; resEl.classList.remove('err'); expr = String(+v.toPrecision(12)); justEvaluated = true; exprEl.textContent = faDigits(expr); }
    catch (e) { resEl.textContent = t(e === 'div0' ? 'Division by zero' : 'Error'); resEl.classList.add('err'); }
    return;
  }
  if (k === 'x²') { if (!expr) return; expr = `(${expr})^2`; render(); return; }
  if (k === '±') { if (!expr) return; expr = expr.startsWith('-(') && expr.endsWith(')') ? expr.slice(2, -1) : `-(${expr})`; render(); return; }
  if (k === '√') { expr += '√'; justEvaluated = false; render(); return; }
  const isOp = '+−×÷%^'.includes(k);
  if (justEvaluated && !isOp) expr = '';
  justEvaluated = false;
  if (isOp && '+−×÷%^'.includes(lastCh) && !(k === '−' && lastCh !== '−')) expr = expr.slice(0, -1);  // replace a trailing operator, but allow a negative sign after one (3×−2)
  if (k === '.' && /\.\d*$/.test(expr.match(/[\d.]*$/)[0])) return;  // one dot per number
  expr += k; render();
}
function addHist(e, r) {
  const b = document.createElement('button'); b.innerHTML = `<span>${faDigits(e)} =</span><b>${r}</b>`; b.addEventListener('click', () => { expr = e; justEvaluated = false; render(); });
  histEl.prepend(b); while (histEl.children.length > 8) histEl.lastChild.remove();
}
document.getElementById('keys').addEventListener('click', e => { const k = e.target.closest('button')?.dataset.k; if (k) press(k); });
const KEYMAP = { '*': '×', 'x': '×', '/': '÷', '-': '−', '+': '+', '%': '%', '^': '^', '(': '(', ')': ')', '.': '.', ',': '.', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Delete': 'C', 'Escape': 'C', 'r': '√' };
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) return;
  if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); return; }
  const k = KEYMAP[e.key]; if (k) { press(k); e.preventDefault(); }
});
render();
addEventListener('load', () => { try { window.focus(); } catch (e) {} });
</script>
</body>
</html>
