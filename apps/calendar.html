<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="icon" type="image/png" href="../assets/waish.png?v=20260916b">
<link rel="apple-touch-icon" href="../assets/waish.png?v=20260916b">
<link rel="stylesheet" href="../css/site.css?v=20260916b">
<link rel="stylesheet" href="../css/apps.css?v=20260916b">
<style>
  .app-main { flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 0; }
  .cal-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
  .cal-head h2 { flex: 1; font-size: 20px; letter-spacing: -.5px; font-family: var(--sans); }
  body.fa .cal-head h2 { font-family: var(--fa); letter-spacing: 0; }
  .cal-head h2 small { display: block; font-family: var(--mono); font-size: 11px; color: var(--term-dim); font-weight: 400; margin-top: 2px; }
  body.fa .cal-head h2 small { font-family: var(--fa); }
  .cal-head .nav { display: flex; gap: 4px; }
  .cal-head .nav button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink); cursor: pointer; font-size: 14px; }
  .cal-head .nav button:hover { border-color: rgba(255,59,59,.45); background: rgba(255,59,59,.1); }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 4px; padding: 6px 12px 12px; }
  .grid .wd { font-family: var(--mono); font-size: 11px; color: var(--term-dim); text-align: center; align-self: end; padding-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  body.fa .grid .wd { font-family: var(--fa); text-transform: none; }
  .grid .wd.off { color: rgba(255,59,59,.6); }
  .day { position: relative; border-radius: 9px; border: 1px solid transparent; background: rgba(255,255,255,.025); padding: 6px 7px; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; cursor: pointer; font-family: var(--mono); transition: background .12s, border-color .12s; text-align: left; color: var(--ink); }
  body.fa .day { font-family: var(--fa); text-align: right; }
  .day:hover { background: rgba(255,255,255,.06); border-color: var(--line); }
  .day .n { font-size: 15px; font-weight: 600; line-height: 1; }
  .day .s { font-size: 10px; color: var(--term-dim); align-self: flex-end; }
  body.fa .day .s { align-self: flex-start; }
  .day.other { opacity: .32; }
  .day.off .n { color: var(--accent-soft); }
  .day.today { border-color: var(--accent); background: rgba(255,59,59,.12); }
  .day.today .n { color: var(--accent-soft); }
  .day.sel { border-color: rgba(139,92,246,.7); background: rgba(139,92,246,.16); }
  .foot { flex: none; border-top: 1px solid var(--line); padding: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; min-height: 40px; }
  body.fa .foot { font-family: var(--fa); }
  .foot b { color: var(--ink); font-weight: 500; }
  @media (max-width: 420px) { .day .s { display: none; } .cal-head h2 { font-size: 16px; } }
</style>
</head>
<body class="app">
<div class="app-bar"><b>📅 <span data-t="Calendar">Calendar</span></b><span class="sp"></span>
  <div class="seg" id="mode"><button data-m="j" data-t="Persian">Persian</button><button data-m="g" data-t="Gregorian">Gregorian</button></div>
  <button class="abtn sm" id="todayBtn" data-t="Today">Today</button></div>
<div class="app-main">
  <div class="cal-head"><h2 id="title">—<small id="sub"></small></h2><div class="nav"><button id="prev" title="previous month">‹</button><button id="next" title="next month">›</button></div></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* ---------- language ---------- */
const FA = { 'Calendar': 'تقویم', 'Persian': 'شمسی', 'Gregorian': 'میلادی', 'Today': 'امروز', 'Iran time': 'به وقت ایران' };
let lang = 'en'; try { lang = localStorage.getItem('waish-lang') === 'fa' ? 'fa' : 'en'; } catch (e) {}
const t = s => lang === 'fa' && FA[s] ? FA[s] : s;
if (lang === 'fa') { document.body.classList.add('fa'); document.documentElement.dir = 'rtl'; document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); }
const fd = s => lang === 'fa' ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s);

/* ---------- Jalali <-> Gregorian (jalaali algorithm) ---------- */
const div = (a, b) => ~~(a / b), mod = (a, b) => a - ~~(a / b) * b;
function g2d(gy, gm, gd) { let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408; return d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752; }
function d2g(jdn) { let j = 4 * jdn + 139361631; j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908; const i = div(mod(j, 1461), 4) * 5 + 308; const gd = div(mod(i, 153), 5) + 1, gm = mod(div(i, 153), 12) + 1, gy = div(j, 1461) - 100100 + div(8 - gm, 6); return { gy, gm, gd }; }
function jalCal(jy) {
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  const gy = jy + 621; let leapJ = -14, jp = breaks[0], jm, jump = 0, n, i;
  for (i = 1; i < breaks.length; i++) { jm = breaks[i]; jump = jm - jp; if (jy < jm) break; leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4); jp = jm; }
  n = jy - jp; leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150, march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4); if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function j2d(jy, jm, jd) { const r = jalCal(jy); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1; }
function d2j(jdn) {
  const gy = d2g(jdn).gy; let jy = gy - 621; const r = jalCal(jy); const jdn1f = g2d(gy, 3, r.march); let k = jdn - jdn1f, jm, jd;
  if (k >= 0) { if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 }; k -= 186; } else { jy -= 1; k += 179; if (r.leap === 1) k += 1; }
  jm = 7 + div(k, 30); jd = mod(k, 30) + 1; return { jy, jm, jd };
}
const jLeap = jy => jalCal(jy).leap === 0;
const jMonthLen = (jy, jm) => jm <= 6 ? 31 : jm <= 11 ? 30 : (jLeap(jy) ? 30 : 29);
const gMonthLen = (gy, gm) => new Date(Date.UTC(gy, gm, 0)).getUTCDate();
const weekday = jdn => mod(jdn + 1, 7);   // 0 = Sunday … 6 = Saturday

/* ---------- names ---------- */
const JM = { en: ['Farvardin', 'Ordibehesht', 'Khordad', 'Tir', 'Mordad', 'Shahrivar', 'Mehr', 'Aban', 'Azar', 'Dey', 'Bahman', 'Esfand'], fa: ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'] };
const GM = { en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'], fa: ['ژانویه', 'فوریه', 'مارس', 'آوریل', 'مه', 'ژوئن', 'ژوئیه', 'اوت', 'سپتامبر', 'اکتبر', 'نوامبر', 'دسامبر'] };
const WD = { en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], fa: ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'] };
const WDS = { en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], fa: ['ی', 'د', 'س', 'چ', 'پ', 'ج', 'ش'] };

/* ---------- today in Tehran ---------- */
function todayJDN() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-').map(Number);
  return g2d(p[0], p[1], p[2]);
}
const TODAY = todayJDN();

/* ---------- state ---------- */
let mode = 'j'; try { mode = localStorage.getItem('waish-cal-mode') || (lang === 'fa' ? 'j' : 'g'); } catch (e) {}
let view = mode === 'j' ? (() => { const j = d2j(TODAY); return { y: j.jy, m: j.jm }; })() : (() => { const g = d2g(TODAY); return { y: g.gy, m: g.gm }; })();
let selected = TODAY;

const grid = document.getElementById('grid'), title = document.getElementById('title'), sub = document.getElementById('sub'), foot = document.getElementById('foot');
function setMode(m) {
  if (m === mode) { render(); return; }
  // keep roughly the same month on screen when switching: anchor on the selected day if it's visible, else mid-month
  const first = mode === 'j' ? j2d(view.y, view.m, 1) : g2d(view.y, view.m, 1);
  const len = mode === 'j' ? jMonthLen(view.y, view.m) : gMonthLen(view.y, view.m);
  const anchor = (selected >= first && selected < first + len) ? selected : first + 14;
  mode = m; try { localStorage.setItem('waish-cal-mode', m); } catch (e) {}
  if (m === 'j') { const j = d2j(anchor); view = { y: j.jy, m: j.jm }; } else { const g = d2g(anchor); view = { y: g.gy, m: g.gm }; }
  render();
}
function shift(n) { view.m += n; if (view.m > 12) { view.m = 1; view.y++; } if (view.m < 1) { view.m = 12; view.y--; } render(); }
function render() {
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  const J = mode === 'j';
  const firstJDN = J ? j2d(view.y, view.m, 1) : g2d(view.y, view.m, 1);
  const len = J ? jMonthLen(view.y, view.m) : gMonthLen(view.y, view.m);
  const startDow = J ? 6 : 1;                                      // Persian weeks start Saturday, Gregorian on Monday
  const lead = mod(weekday(firstJDN) - startDow, 7);
  const names = J ? JM[lang] : GM[lang];
  title.firstChild.textContent = `${names[view.m - 1]} ${fd(view.y)}`;
  // the other calendar's range for this month
  const a = J ? d2g(firstJDN) : d2j(firstJDN), b = J ? d2g(firstJDN + len - 1) : d2j(firstJDN + len - 1);
  const oNames = J ? GM[lang] : JM[lang];
  const oy = J ? [a.gy, b.gy] : [a.jy, b.jy], om = J ? [a.gm, b.gm] : [a.jm, b.jm];
  sub.textContent = om[0] === om[1] ? `${oNames[om[0] - 1]} ${fd(oy[0])}` : `${oNames[om[0] - 1]} ${fd(oy[0])} – ${oNames[om[1] - 1]} ${fd(oy[1])}`;
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) { const d = (startDow + i) % 7; const el = document.createElement('div'); el.className = 'wd' + (isOff(d, J) ? ' off' : ''); el.textContent = (lang === 'fa' ? WDS.fa : WD.en)[d]; grid.appendChild(el); }
  const cells = Math.ceil((lead + len) / 7) * 7;
  for (let i = 0; i < cells; i++) {
    const jdn = firstJDN - lead + i, inMonth = i >= lead && i < lead + len, dow = weekday(jdn);
    const main = J ? d2j(jdn) : d2g(jdn), other = J ? d2g(jdn) : d2j(jdn);
    const mainDay = J ? main.jd : main.gd, otherDay = J ? other.gd : other.jd, otherMonth = J ? other.gm : other.jm;
    const el = document.createElement('button'); el.type = 'button';
    el.className = 'day' + (inMonth ? '' : ' other') + (isOff(dow, J) ? ' off' : '') + (jdn === TODAY ? ' today' : '') + (jdn === selected ? ' sel' : '');
    el.innerHTML = `<span class="n">${fd(mainDay)}</span><span class="s">${otherDay === 1 ? (J ? GM[lang][otherMonth - 1].slice(0, 3) : JM[lang][otherMonth - 1].slice(0, lang === 'fa' ? 9 : 3)) + ' ' : ''}${fd(otherDay)}</span>`;
    el.addEventListener('click', () => { selected = jdn; render(); });
    grid.appendChild(el);
  }
  renderFoot();
}
const isOff = (dow, J) => J ? dow === 5 : (dow === 0 || dow === 6);
function renderFoot() {
  const j = d2j(selected), g = d2g(selected), dow = weekday(selected);
  const wd = WD[lang][dow];
  foot.innerHTML = `<span>${wd}</span><span><b>${fd(j.jd)} ${JM[lang][j.jm - 1]} ${fd(j.jy)}</b></span><span><b>${fd(g.gd)} ${GM[lang][g.gm - 1]} ${fd(g.gy)}</b></span>` +
    (selected === TODAY ? `<span style="color:var(--accent-soft)">${t('Today')} · ${t('Iran time')}</span>` : `<span>${fd(Math.abs(selected - TODAY))} ${lang === 'fa' ? (selected > TODAY ? 'روز دیگر' : 'روز پیش') : (selected > TODAY ? 'days ahead' : 'days ago')}</span>`);
}
document.getElementById('mode').addEventListener('click', e => { const m = e.target.dataset.m; if (m) setMode(m); });
document.getElementById('prev').addEventListener('click', () => shift(lang === 'fa' ? 1 : -1));
document.getElementById('next').addEventListener('click', () => shift(lang === 'fa' ? -1 : 1));
document.getElementById('todayBtn').addEventListener('click', () => { selected = TODAY; if (mode === 'j') { const j = d2j(TODAY); view = { y: j.jy, m: j.jm }; } else { const g = d2g(TODAY); view = { y: g.gy, m: g.gm }; } render(); });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') shift(lang === 'fa' ? 1 : -1); else if (e.key === 'ArrowRight') shift(lang === 'fa' ? -1 : 1); else if (e.key.toLowerCase() === 't') document.getElementById('todayBtn').click(); });
render();
</script>
</body>
</html>
