<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music</title>
<link rel="icon" type="image/png" href="../assets/waish.png?v=20260916b">
<link rel="apple-touch-icon" href="../assets/waish.png?v=20260916b">
<link rel="stylesheet" href="../css/site.css?v=20260916b">
<link rel="stylesheet" href="../css/apps.css?v=20260916b">
<style>
  .app-main { flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 0; overflow: hidden; }
  .player { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* now playing */
  .now { padding: 22px 20px 14px; display: flex; gap: 18px; align-items: center; background: linear-gradient(180deg, rgba(139,92,246,.14), transparent); border-bottom: 1px solid var(--line); }
  .art { flex: none; width: 92px; height: 92px; border-radius: 16px; display: flex; align-items: end; justify-content: center; gap: 4px; padding-bottom: 16px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #8b5cf6, #4c1d95); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 16px 30px -16px rgba(139,92,246,.9), inset 0 1px 0 rgba(255,255,255,.14); }
  .art::before { content: '♪'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: rgba(255,255,255,.18); }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .art.has img { display: block; } .art.has::before { display: none; }
  .art.has i { display: none; }
  .playing .art.has i { display: block; }   /* the bars stay visible on a cover: they sit on a dark strip at the bottom */
  .art.has .bars { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(transparent, rgba(0,0,0,.65)); display: none; }
  .playing .art.has .bars { display: block; }
  .art i { width: 6px; height: 10px; border-radius: 3px; background: #fff; opacity: .9; transform-origin: bottom; }
  .playing .art i { animation: bar .9s ease-in-out infinite; }
  .playing .art i:nth-child(2) { animation-delay: -.3s; } .playing .art i:nth-child(3) { animation-delay: -.6s; } .playing .art i:nth-child(4) { animation-delay: -.15s; }
  @keyframes bar { 0%, 100% { height: 8px; } 50% { height: 30px; } }
  .meta { flex: 1; min-width: 0; }
  .meta .title { font-size: 19px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .artist { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .idx { font-family: var(--mono); font-size: 11px; color: var(--term-dim); margin-top: 8px; }
  /* seek + controls */
  .bar-row { padding: 12px 20px 4px; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--term-dim); direction: ltr; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), rgba(255,255,255,.12) var(--p, 0%)); outline: none; cursor: pointer; }
  #seek { background: linear-gradient(90deg, rgba(255,255,255,.1) var(--b0, 0%), rgba(255,255,255,.28) var(--b0, 0%), rgba(255,255,255,.28) var(--b, 0%), rgba(255,255,255,.1) var(--b, 0%)), linear-gradient(90deg, var(--accent) var(--p, 0%), transparent var(--p, 0%)); background-blend-mode: normal; }   /* red = played · light = the part streamed so far */
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  #seek { flex: 1; }
  .controls { padding: 8px 20px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 1px solid var(--line); direction: ltr; }
  .cbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s, transform .1s; }
  .cbtn svg { width: 18px; height: 18px; fill: currentColor; }
  .cbtn svg.off { display: none; }   /* (the hidden attribute doesn't work on inline SVG from JS) */
  .cbtn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
  .cbtn:active { transform: scale(.94); }
  .cbtn.play { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); border-color: var(--accent); color: #fff; }
  .cbtn.play:hover { background: var(--accent-soft); }
  .cbtn.play svg { width: 22px; height: 22px; }
  .cbtn.on { border-color: rgba(139,92,246,.7); background: rgba(139,92,246,.2); color: #c4b5fd; }
  #repeat { position: relative; }
  #repeat .one { display: none; position: absolute; right: 4px; bottom: 3px; font-family: var(--mono); font-size: 9px; font-weight: 700; line-height: 1; padding: 1px 3px; border-radius: 4px; background: #c4b5fd; color: #2e1065; }
  #repeat.one .one { display: block; }
  .vol { margin-left: 10px; display: flex; align-items: center; gap: 8px; }
  .vol .cbtn { width: 34px; height: 34px; border-radius: 10px; }
  .vol .cbtn svg { width: 15px; height: 15px; }
  #volume { width: 96px; }
  .vol .pct { font-family: var(--mono); font-size: 11px; color: var(--term-dim); width: 34px; text-align: right; }
  /* playlist */
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  .song { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 10px; background: transparent; border: 1px solid transparent; color: var(--ink); font-family: var(--sans); font-size: 13px; cursor: pointer; text-align: left; transition: background .12s, border-color .12s; }
  .song:hover { background: rgba(255,255,255,.05); }
  .song.on { background: rgba(139,92,246,.14); border-color: rgba(139,92,246,.35); }
  .song .n { font-family: var(--mono); font-size: 11px; color: var(--term-dim); width: 20px; text-align: right; flex: none; }
  .song .th { flex: none; width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: linear-gradient(135deg, #8b5cf6, #4c1d95); border: 1px solid rgba(255,255,255,.08); }
  .song.on .n { color: #c4b5fd; }
  .song .s-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .s-title small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .song .dur { font-family: var(--mono); font-size: 11px; color: var(--term-dim); flex: none; }
  .song.on .eq { display: flex; gap: 2px; align-items: end; height: 12px; flex: none; }
  .eq { display: none; } .eq i { width: 3px; height: 4px; background: #c4b5fd; border-radius: 1px; }
  .playing .song.on .eq i { animation: bar 1s ease-in-out infinite; } .playing .song.on .eq i:nth-child(2) { animation-delay: -.4s; } .playing .song.on .eq i:nth-child(3) { animation-delay: -.7s; }
  .playing .song.on .eq i { animation-name: eq; } @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  body.fa .song { text-align: right; }
  body.fa .meta { text-align: right; }
  @media (max-width: 420px) { .vol .pct { display: none; } #volume { width: 70px; } }
</style>
</head>
<body class="app">
  <div class="app-bar"><b data-t="Music">Music</b><span class="pill" id="count"></span><span class="sp"></span><span class="pill" id="state" data-t="stopped">stopped</span></div>
  <div class="app-main">
    <div class="player" id="player">
      <div class="now">
        <div class="art" id="art"><img id="cover" alt=""><span class="bars"></span><i></i><i></i><i></i><i></i></div>
        <div class="meta"><div class="title" id="title">—</div><div class="artist" id="artist" data-t="pick a song below">pick a song below</div><div class="idx" id="idx"></div></div>
      </div>
      <div class="bar-row"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
      <div class="controls">
        <button class="cbtn" id="shuffle" title="shuffle"><svg viewBox="0 0 24 24"><path d="M17 4h4v4l-1.5-1.5L15 11l-1.4-1.4 4.5-4.5L17 4zM3 5h4.5l3.1 3.1-1.4 1.4L6.7 7H3V5zm14 15l-1.5-1.5L11.6 14 13 12.6l4.5 4.5L19 15.6V20h-2zM3 17h3.7l3.6-3.6 1.4 1.4L7.5 19H3v-2z"/></svg></button>
        <button class="cbtn" id="prev" title="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="cbtn play" id="play" title="play / pause"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="icoPause" class="off" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
        <button class="cbtn" id="stop" title="stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
        <button class="cbtn" id="next" title="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button class="cbtn" id="repeat" title="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><b class="one">1</b></button>
        <div class="vol">
          <button class="cbtn" id="mute" title="mute"><svg id="icoVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><svg id="icoMute" class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7z"/></svg></button>
          <input type="range" id="volume" min="0" max="100" value="70"><span class="pct" id="pct">70%</span>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
<script src="../assets/music/list.js"></script>
<script>
/* ---------- music player: plays the mp3s in assets/music/ (list.json is written by the upload step) ---------- */
const FA = { 'repeat': 'تکرار', 'repeat all': 'تکرار همه', 'repeat one': 'تکرار همین آهنگ', 'Music': 'موزیک', 'stopped': 'متوقف', 'playing': 'در حال پخش', 'paused': 'مکث', 'loading': 'در حال بارگذاری', "couldn't load this song": 'این آهنگ لود نشد', 'pick a song below': 'یه آهنگ از پایین انتخاب کن', 'songs': 'آهنگ', 'loading…': 'در حال بارگذاری…', 'song': 'آهنگ', 'of': 'از', "couldn't load the playlist": 'لیست پخش لود نشد' };
let lang = 'en'; try { lang = localStorage.getItem('waish-lang') === 'fa' ? 'fa' : 'en'; } catch (e) {}
const t = s => lang === 'fa' && FA[s] ? FA[s] : s;
if (lang === 'fa') { document.body.classList.add('fa'); document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); }
const faDigits = s => lang === 'fa' ? String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(s);
const $ = s => document.querySelector(s);
const audio = $('#audio'), list = $('#list'), player = $('#player');
const MUSIC_BASE = '../assets/music/';   // songs and their covers (assets/music/covers/, made by tools/music-covers.py)
let songs = [], cur = -1, shuffle = false, repeat = 'off', lastVol = .7, seeking = false;   // repeat: 'off' (stop after the last song) → 'all' (wrap around) → 'one' (loop this song)
const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return faDigits(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`); };
const setP = (el, v) => el.style.setProperty('--p', v + '%');

function render() {
  list.innerHTML = '';
  songs.forEach((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'song' + (i === cur ? ' on' : ''); b.dataset.i = i;
    b.innerHTML = `<span class="n">${faDigits(i + 1)}</span>${s.cover ? `<img class="th" src="${MUSIC_BASE}${s.cover}" alt="" loading="lazy" onerror="this.remove()">` : `<span class="th"></span>`}<span class="s-title">${esc(s.title)}<small>${esc(s.artist)}</small></span><span class="eq"><i></i><i></i><i></i></span><span class="dur">${s.dur ? fmt(s.dur) : ''}</span>`;
    b.addEventListener('click', () => play(i));
    list.appendChild(b);
  });
  $('#count').textContent = `${faDigits(songs.length)} ${t('songs')}`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mark() {
  list.querySelectorAll('.song').forEach(b => b.classList.toggle('on', +b.dataset.i === cur));
  const s = songs[cur];
  $('#title').textContent = s ? s.title : '—'; $('#artist').textContent = s ? s.artist : t('pick a song below');
  $('#idx').textContent = s ? `${t('song')} ${faDigits(cur + 1)} ${t('of')} ${faDigits(songs.length)}` : '';
  const art = $('#art'), img = $('#cover');
  if (s && s.cover) { img.src = MUSIC_BASE + s.cover; art.classList.add('has'); } else { img.removeAttribute('src'); art.classList.remove('has'); }
  const on = list.querySelector('.song.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function state(st) {
  const playing = st === 'playing';
  player.classList.toggle('playing', playing);
  $('#icoPlay').classList.toggle('off', playing); $('#icoPause').classList.toggle('off', !playing);
  $('#state').textContent = t(st);
}
/* Songs come as plain bytes from /api/track (not a .mp3 URL, not an audio content-type — download managers such as
   IDM hijack those and pop a download dialog). They are STREAMED through a MediaSource: chunks are appended as they
   arrive, so a song starts after the first few KB. Seeking outside what's buffered restarts the stream from the
   matching byte offset (Range request), so any point of a song is reachable instantly. Browsers without MP3
   MediaSource support (old Safari) download the file into a blob first. */
/* WHERE THE SONGS COME FROM — assets/music/, next to the site. The playlist is assets/music/list.js (a script, so it
   also loads when the site is opened straight from index.html). On http(s) the songs are streamed with fetch + MediaSource
   (instant start, seek anywhere); opened from a file:// folder the browser blocks fetch, so the <audio> element plays the
   file directly instead. */
const FILE = location.protocol === 'file:';
const MSE = !FILE && 'MediaSource' in window && MediaSource.isTypeSupported('audio/mpeg');
let S = null;   // the current stream: { i, ms, sb, size, ctrl, url }
const trackUrl = i => MUSIC_BASE + encodeURIComponent(songs[i].file);
const setB = (from, to) => { $('#seek').style.setProperty('--b0', from + '%'); $('#seek').style.setProperty('--b', to + '%'); };
const sleep = ms => new Promise(res => setTimeout(res, ms));
function dropStream() { if (S) { if (S.ctrl) S.ctrl.abort(); if (S.url) URL.revokeObjectURL(S.url); S = null; } setB(0, 0); }
async function startTrack(i, at = 0) {
  dropStream(); state('loading');
  if (FILE) {   // opened from a folder: no fetch allowed, so the audio element loads the file itself
    S = { i, ctrl: null, url: '' }; audio.src = trackUrl(i); setB(0, 100);
    if (at) audio.currentTime = at;
    return audio.play().then(() => state('playing')).catch(() => state('paused'));
  }
  if (!MSE) {   // fallback: fetch everything, then play from a blob
    const ctrl = new AbortController(); S = { i, ctrl, url: '' };
    const r = await fetch(trackUrl(i), { signal: ctrl.signal }).catch(() => null); if (!r || ctrl.signal.aborted) return;
    const buf = await r.arrayBuffer(); if (ctrl.signal.aborted) return;
    audio.src = S.url = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' })); setB(0, 100);
    if (at) audio.currentTime = at;
    return audio.play().then(() => state('playing')).catch(() => state('paused'));
  }
  const ms = new MediaSource(); const url = URL.createObjectURL(ms); audio.src = url;
  const me = S = { i, ms, sb: null, size: 0, ctrl: null, url };
  await new Promise(res => ms.addEventListener('sourceopen', res, { once: true })); if (S !== me) return;
  me.sb = ms.addSourceBuffer('audio/mpeg');
  try { ms.duration = songs[i].dur || 0; } catch (e) {}
  return streamFrom(at);
}
const settle = sb => new Promise(res => sb.addEventListener('updateend', res, { once: true }));
async function streamFrom(at) {
  const me = S; if (!me || !me.sb) return;
  if (me.ctrl) me.ctrl.abort(); const ctrl = me.ctrl = new AbortController(), sig = ctrl.signal, sb = me.sb, ms = me.ms;
  try { sb.abort(); } catch (e) {}                                          // cancels an append in flight, resets the parser
  if (sb.buffered.length) { try { sb.remove(0, Infinity); await settle(sb); } catch (e) {} }
  if (S !== me || sig.aborted) return;
  try { sb.timestampOffset = at; } catch (e) {}
  const dur = songs[me.i].dur || 0, offset = at && me.size && dur ? Math.floor(at / dur * me.size) : 0;
  const r = await fetch(trackUrl(me.i), { signal: sig, headers: offset ? { Range: `bytes=${offset}-` } : {} }).catch(() => null);
  if (S !== me || sig.aborted) return;
  if (!r || !r.ok) { state('stopped'); $('#artist').textContent = t("couldn't load this song"); return; }
  const cr = (r.headers.get('Content-Range') || '').match(/\/(\d+)/);
  me.size = +r.headers.get('X-File-Size') || (cr && +cr[1]) || (!offset && +r.headers.get('Content-Length')) || me.size;
  const reader = r.body.getReader(); let got = offset, started = false;
  const from = me.size ? Math.round(offset / me.size * 100) : 0;
  const append = async chunk => {
    for (let tries = 0; tries < 900; tries++) {   // quota: the buffer holds a few MB; free what was already played, or wait for playback to move on
      if (S !== me || sig.aborted || ms.readyState !== 'open') return false;
      try { sb.appendBuffer(chunk); await settle(sb); return true; }
      catch (e) {
        if (e.name !== 'QuotaExceededError') return false;
        const keepFrom = Math.max(0, audio.currentTime - 5);
        if (sb.buffered.length && sb.buffered.start(0) < keepFrom - 1) { try { sb.remove(0, keepFrom); await settle(sb); } catch (_) {} }
        else await sleep(500);
      }
    }
    return false;
  };
  while (true) {
    const { done, value } = await reader.read().catch(() => ({ done: true }));
    if (done || S !== me || sig.aborted) break;
    if (!await append(value)) break;
    got += value.length; if (me.size) setB(from, Math.round(got / me.size * 100));
    if (!started) { started = true; if (at) audio.currentTime = at; audio.play().then(() => state('playing')).catch(() => state('paused')); }
  }
  if (S === me && !sig.aborted && ms.readyState === 'open') { try { ms.endOfStream(); } catch (e) {} }
}
const buffered = time => { const sb = S && S.sb; if (!sb) return false; for (let k = 0; k < sb.buffered.length; k++) if (time >= sb.buffered.start(k) - .5 && time <= sb.buffered.end(k)) return true; return false; };
function seekTo(time) {
  if (!S) return;
  if (!MSE || buffered(time)) { audio.currentTime = time; return; }
  state('loading'); streamFrom(time);   // outside the buffer → restart the stream at the matching byte offset
}
async function play(i) {
  if (!songs.length) return;
  if (i === undefined && cur < 0) i = 0;
  if (i !== undefined && i !== cur) { cur = (i + songs.length) % songs.length; mark(); audio.pause(); return startTrack(cur); }
  if (cur >= 0 && !S) return startTrack(cur);
  audio.play().then(() => state('playing')).catch(() => state('paused'));
}
function pause() { audio.pause(); state('paused'); }
function stop() {   // drop the stream entirely; the next play() streams the song again from the start
  audio.pause(); dropStream(); audio.removeAttribute('src'); try { audio.load(); } catch (e) {}
  state('stopped'); $('#cur').textContent = fmt(0); $('#seek').value = 0; setP($('#seek'), 0); $('#dur').textContent = fmt(songs[cur] ? songs[cur].dur : 0);
}
function next(auto) {
  if (!songs.length) return;
  if (shuffle && songs.length > 1) { let n; do { n = Math.floor(Math.random() * songs.length); } while (n === cur); return play(n); }
  if (auto && repeat === 'one') return startTrack(cur);                        // loop this song: stream it again from the start
  if (auto && repeat === 'off' && cur === songs.length - 1) { stop(); return; }   // end of the list: stop ('all' wraps around)
  play(cur + 1);
}
function prev() { if (audio.currentTime > 3) { seekTo(0); return; } play(cur - 1); }
function tick() {
  if (seeking) return;
  const d = (isFinite(audio.duration) && audio.duration) || (songs[cur] && songs[cur].dur) || 0, c = audio.currentTime || 0;
  $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
  const v = d ? Math.round(c / d * 1000) : 0; $('#seek').value = v; setP($('#seek'), v / 10);
}
function volume(v) {
  v = Math.max(0, Math.min(1, v)); audio.volume = v; audio.muted = v === 0;
  $('#volume').value = Math.round(v * 100); setP($('#volume'), Math.round(v * 100)); $('#pct').textContent = faDigits(Math.round(v * 100)) + '%';
  $('#icoVol').classList.toggle('off', v === 0); $('#icoMute').classList.toggle('off', v !== 0);
  if (v > 0) lastVol = v;
}

$('#play').addEventListener('click', () => audio.paused ? play() : pause());
$('#stop').addEventListener('click', stop);
$('#next').addEventListener('click', () => next(false));
$('#prev').addEventListener('click', prev);
$('#shuffle').addEventListener('click', e => { shuffle = !shuffle; e.currentTarget.classList.toggle('on', shuffle); });
$('#repeat').addEventListener('click', e => {
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  const b = e.currentTarget; b.classList.toggle('on', repeat !== 'off'); b.classList.toggle('one', repeat === 'one');
  b.title = repeat === 'off' ? t('repeat') : repeat === 'all' ? t('repeat all') : t('repeat one');
});
$('#mute').addEventListener('click', () => volume(audio.volume > 0 && !audio.muted ? 0 : lastVol || .7));
$('#volume').addEventListener('input', e => volume(e.target.value / 100));
$('#seek').addEventListener('pointerdown', () => seeking = true);
$('#seek').addEventListener('input', e => { setP(e.target, e.target.value / 10); $('#cur').textContent = fmt((audio.duration || 0) * e.target.value / 1000); });
$('#seek').addEventListener('change', e => { seeking = false; const d = audio.duration || (songs[cur] && songs[cur].dur) || 0; if (d) seekTo(d * e.target.value / 1000); });
audio.addEventListener('timeupdate', tick); audio.addEventListener('loadedmetadata', () => { if (songs[cur]) { songs[cur].dur = audio.duration; const b = list.querySelector(`.song[data-i="${cur}"] .dur`); if (b) b.textContent = fmt(audio.duration); } tick(); });
audio.addEventListener('ended', () => next(true));
audio.addEventListener('play', () => state('playing')); audio.addEventListener('pause', () => { if (audio.currentTime > 0 && audio.currentTime < (audio.duration || Infinity)) state('paused'); });
audio.addEventListener('error', () => { state('stopped'); $('#artist').textContent = "couldn't play this file"; });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? play() : pause(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next(false); else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight') seekTo(Math.min(audio.duration || 0, audio.currentTime + 5)); else if (e.key === 'ArrowLeft') seekTo(Math.max(0, audio.currentTime - 5));
  else if (e.key === 'ArrowUp') { e.preventDefault(); volume(audio.volume + .05); } else if (e.key === 'ArrowDown') { e.preventDefault(); volume(audio.volume - .05); }
});
$('#cover').addEventListener('error', () => $('#art').classList.remove('has'));
volume(.7);
$('#count').textContent = t('loading…');
if (Array.isArray(window.MUSIC_LIST) && window.MUSIC_LIST.length) { songs = window.MUSIC_LIST; render(); mark(); }
else $('#count').textContent = t("couldn't load the playlist");
</script>
</body>
